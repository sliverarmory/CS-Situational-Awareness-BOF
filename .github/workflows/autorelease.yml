name: Armory Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: armory-release-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: "0"

jobs:
  reflektor-runtime:
    name: Execute the complete BOF corpus through Reflektor
    uses: sliverarmory/reflektor/.github/workflows/bof-corpus.yml@becda82f5763b48e23c8e55c244653ad47a3db5c
    with:
      corpus_repository: ${{ github.repository }}
      corpus_ref: ${{ github.sha }}
      reflektor_ref: becda82f5763b48e23c8e55c244653ad47a3db5c

  build-signed-candidate:
    name: Build and verify signed candidate
    needs: reflektor-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: armory-release
    permissions:
      contents: read
    steps:
      - name: Check out the approved tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved annotated tag
        shell: bash
        env:
          ARMORY_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$ARMORY_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: release tags must be exact vMAJOR.MINOR.PATCH versions" >&2
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/$ARMORY_VERSION")" = "tag"
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ARMORY_VERSION")"
          test "$(jq -r '.object.type' <<<"$tag_ref")" = "tag"
          tag_object_sha="$(jq -er '.object.sha' <<<"$tag_ref")"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
          release_commit="$(git rev-parse HEAD)"
          test "$(jq -r '.object.type' <<<"$tag_object")" = "commit"
          test "$(jq -r '.object.sha' <<<"$tag_object")" = "$release_commit"
          test "$(jq -r '.verification.verified' <<<"$tag_object")" = "true"
          test "$(git rev-parse "refs/tags/$ARMORY_VERSION^{commit}")" = "$release_commit"
          test "$(git rev-parse "$GITHUB_SHA^{commit}")" = "$release_commit"
          git fetch --no-tags origin master
          test "$(git rev-parse origin/master)" = "$release_commit"

      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.0

      - name: Verify runner tools and select LLVM inspectors
        shell: bash
        run: |
          set -euo pipefail
          for tool in bash file jq node python3; do
            command -v "$tool" >/dev/null
          done
          test "$(zig version)" = "0.14.0"
          llvm_nm="$(command -v llvm-nm-18 || command -v llvm-nm || true)"
          llvm_objdump="$(command -v llvm-objdump-18 || command -v llvm-objdump || true)"
          test -n "$llvm_nm"
          test -n "$llvm_objdump"
          {
            printf 'LLVM_NM=%s\n' "$llvm_nm"
            printf 'NM=%s\n' "$llvm_nm"
            printf 'OBJDUMP=%s\n' "$llvm_objdump"
          } >> "$GITHUB_ENV"

      - name: Install checksum-verified minisign
        shell: bash
        run: |
          set -euo pipefail
          for tool in curl jq sha256sum tar; do
            command -v "$tool" >/dev/null
          done
          minisign_url="$(jq -er '.minisign.linux_amd64.url' packaging/release-config.json)"
          minisign_sha="$(jq -er '.minisign.linux_amd64.sha256' packaging/release-config.json)"
          archive="$RUNNER_TEMP/minisign-linux-amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" "$minisign_url"
          printf '%s  %s\n' "$minisign_sha" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/minisign-bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/minisign-bin" minisign
          chmod 0755 "$RUNNER_TEMP/minisign-bin/minisign"

      - name: Materialize signing key outside the workspace
        shell: bash
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.ARMORY_MINISIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$MINISIGN_PRIVATE_KEY"
          printf '%b' "$MINISIGN_PRIVATE_KEY" > "$RUNNER_TEMP/minisign.key"
          test -s "$RUNNER_TEMP/minisign.key"

      - name: Build signed release candidate
        shell: bash
        env:
          ARMORY_SIGNING_KEY: ${{ runner.temp }}/minisign.key
          ARMORY_VERSION: ${{ github.ref_name }}
          MINISIGN: ${{ runner.temp }}/minisign-bin/minisign
        run: ./make_all.sh

      - name: Verify exact signed inventory
        shell: bash
        env:
          ARMORY_VERSION: ${{ github.ref_name }}
          MINISIGN: ${{ runner.temp }}/minisign-bin/minisign
        run: |
          set -euo pipefail
          python3 packaging/armory_packages.py verify \
            --version "$ARMORY_VERSION" \
            --input packages \
            --require-signatures \
            --minisign "$MINISIGN"

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/minisign.key"

      - name: Upload signed draft candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-armory-release-${{ github.ref_name }}
          path: |
            dist/
            packages/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    name: Draft, verify, and publish release
    needs: build-signed-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the approved tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-armory-release-${{ github.ref_name }}
          path: .

      - name: Install checksum-verified minisign
        shell: bash
        run: |
          set -euo pipefail
          for tool in curl jq sha256sum tar; do
            command -v "$tool" >/dev/null
          done
          minisign_url="$(jq -er '.minisign.linux_amd64.url' packaging/release-config.json)"
          minisign_sha="$(jq -er '.minisign.linux_amd64.sha256' packaging/release-config.json)"
          archive="$RUNNER_TEMP/minisign-linux-amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" "$minisign_url"
          printf '%s  %s\n' "$minisign_sha" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/minisign-bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/minisign-bin" minisign
          chmod 0755 "$RUNNER_TEMP/minisign-bin/minisign"

      - name: Verify tag and signed candidate
        shell: bash
        env:
          ARMORY_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          MINISIGN: ${{ runner.temp }}/minisign-bin/minisign
        run: |
          set -euo pipefail
          if [[ ! "$ARMORY_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: release tags must be exact vMAJOR.MINOR.PATCH versions" >&2
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/$ARMORY_VERSION")" = "tag"
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ARMORY_VERSION")"
          test "$(jq -r '.object.type' <<<"$tag_ref")" = "tag"
          tag_object_sha="$(jq -er '.object.sha' <<<"$tag_ref")"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
          release_commit="$(git rev-parse HEAD)"
          test "$(jq -r '.object.type' <<<"$tag_object")" = "commit"
          test "$(jq -r '.object.sha' <<<"$tag_object")" = "$release_commit"
          test "$(jq -r '.verification.verified' <<<"$tag_object")" = "true"
          test "$(git rev-parse "refs/tags/$ARMORY_VERSION^{commit}")" = "$release_commit"
          test "$(git rev-parse "$GITHUB_SHA^{commit}")" = "$release_commit"
          git fetch --no-tags origin master
          test "$(git rev-parse origin/master)" = "$release_commit"
          python3 packaging/armory_packages.py verify \
            --version "$ARMORY_VERSION" \
            --input packages \
            --require-signatures \
            --minisign "$MINISIGN"

      - name: Create draft, verify remote assets, and publish
        shell: bash
        env:
          ARMORY_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          MINISIGN: ${{ runner.temp }}/minisign-bin/minisign
        run: |
          set -euo pipefail
          expected_tag_object="$(git rev-parse "refs/tags/$ARMORY_VERSION")"
          release_commit="$(git rev-parse HEAD)"
          verify_remote_release_ref() {
            local tag_ref tag_object_sha tag_object
            tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ARMORY_VERSION")"
            test "$(jq -r '.object.type' <<<"$tag_ref")" = "tag"
            tag_object_sha="$(jq -er '.object.sha' <<<"$tag_ref")"
            test "$tag_object_sha" = "$expected_tag_object"
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
            test "$(jq -r '.object.type' <<<"$tag_object")" = "commit"
            test "$(jq -r '.object.sha' <<<"$tag_object")" = "$release_commit"
            test "$(jq -r '.verification.verified' <<<"$tag_object")" = "true"
            git fetch --no-tags origin master
            test "$(git rev-parse origin/master)" = "$release_commit"
          }

          verify_remote_release_ref
          if gh release view "$ARMORY_VERSION" >/dev/null 2>&1; then
            echo "error: release $ARMORY_VERSION already exists; refusing to overwrite it" >&2
            exit 1
          fi

          gh release create "$ARMORY_VERSION" \
            --verify-tag \
            --draft \
            --title "$ARMORY_VERSION" \
            --generate-notes \
            packages/*

          test "$(gh release view "$ARMORY_VERSION" --json isDraft --jq '.isDraft')" = "true"
          expected_assets="$(find packages -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          actual_assets="$(gh release view "$ARMORY_VERSION" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "error: draft release asset inventory differs from the verified candidate" >&2
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi

          remote_assets="$(mktemp -d)"
          gh release download "$ARMORY_VERSION" --dir "$remote_assets"
          python3 packaging/armory_packages.py verify \
            --version "$ARMORY_VERSION" \
            --input "$remote_assets" \
            --require-signatures \
            --minisign "$MINISIGN"

          verify_remote_release_ref
          gh release edit "$ARMORY_VERSION" --draft=false --latest
          test "$(gh release view "$ARMORY_VERSION" --json isDraft --jq '.isDraft')" = "false"
