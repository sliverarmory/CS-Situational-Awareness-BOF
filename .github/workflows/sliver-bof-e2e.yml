name: Sliver BOF End-to-End

on:
  push:
    branches:
      - master
      - "feat/**"
    paths:
      - ".github/sliver-bof-e2e.json"
      - ".github/workflows/autorelease.yml"
      - ".github/workflows/dev.yml"
      - ".github/workflows/sliver-bof-e2e.yml"
      - "Makefile"
      - "portable/**"
      - "scripts/build-matrix.sh"
      - "scripts/build-target.sh"
      - "scripts/generate-e2e-manifest.mjs"
      - "scripts/prepare-sliver-bof-e2e.sh"
      - "scripts/verify-matrix.sh"
      - "src/**"
      - "testdata/e2e-manifest.json"
      - "testdata/sliver-bof-e2e-policy.json"
  pull_request:
    branches: [master]
    paths:
      - ".github/sliver-bof-e2e.json"
      - ".github/workflows/autorelease.yml"
      - ".github/workflows/dev.yml"
      - ".github/workflows/sliver-bof-e2e.yml"
      - "Makefile"
      - "portable/**"
      - "scripts/build-matrix.sh"
      - "scripts/build-target.sh"
      - "scripts/generate-e2e-manifest.mjs"
      - "scripts/prepare-sliver-bof-e2e.sh"
      - "scripts/verify-matrix.sh"
      - "src/**"
      - "testdata/e2e-manifest.json"
      - "testdata/sliver-bof-e2e-policy.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sliver-bof-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Execute BOFs through Sliver
    uses: sliverarmory/sliver-test-bof/.github/workflows/e2e.yml@b38a09a226bf861a1e56e9dbe07838fe99138582 # v0.1.0 + Windows cleanup fix
    with:
      manifest: .github/sliver-bof-e2e.json
      prepare-command: ./scripts/prepare-sliver-bof-e2e.sh
